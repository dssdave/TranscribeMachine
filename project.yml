name: TranscribeMachine
options:
  bundleIdPrefix: com.dssdave
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.9.0
targets:
  TranscribeMachine:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TranscribeMachine
        excludes:
          - Info.plist
          - TranscribeMachine.entitlements
    resources:
      - path: TranscribeMachine/Resources
    info:
      path: TranscribeMachine/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: TranscribeMachine
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.1.2"
        CFBundleVersion: "36"
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: TranscribeMachine needs microphone access to transcribe in-room audio.
    entitlements:
      path: TranscribeMachine/TranscribeMachine.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.microphone: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dssdave.TranscribeMachine
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: D7LK7963NP
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: D7LK7963NP
          CODE_SIGN_IDENTITY: BB4A24E97493AE7E481954C8F4377520C207CABF
          PROVISIONING_PROFILE_SPECIFIER: TranscribeMachine Mac App Store
